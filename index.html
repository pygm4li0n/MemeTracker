<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050506">
<title>MEME//TRACKER</title>
<meta name="description" content="Curated meme tracker — real on-chain data from DexScreener.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506;
  --card:#0b0b0d;
  --line:#17171a;
  --line-2:#232329;
  --fg:#f4f4f5;
  --fg-2:#a1a1aa;
  --muted:#6b6b75;
  --dim:#3a3a42;
  --green:#3fe081;
  --green-soft:rgba(63,224,129,.09);
  --green-line:rgba(63,224,129,.38);
  --red:#f87171;
  --red-soft:rgba(248,113,113,.09);
  --r:20px;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh;
  background:var(--bg); color:var(--fg);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
button,input{font-family:inherit}
img{display:block}

/* ambient */
.bg-glow{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% -12%, rgba(63,224,129,.055), transparent 62%),
    radial-gradient(700px 520px at 102% -4%, rgba(255,255,255,.028), transparent 62%),
    radial-gradient(900px 700px at 50% 118%, rgba(63,224,129,.028), transparent 65%);
}
.grain{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.035; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.wrap{width:100%; max-width:1400px; margin:0 auto; padding:0 16px; position:relative; z-index:1}

/* header */
.header{
  position:sticky; top:0; z-index:60;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(5,5,6,.94), rgba(5,5,6,.76));
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
}
.header__inner{height:56px; display:flex; align-items:center; justify-content:space-between; gap:16px}
.brand{
  font:900 13px/1 'Inter',sans-serif; letter-spacing:-.015em;
  color:var(--fg); text-decoration:none;
  display:inline-flex; align-items:center;
}
.brand span{color:var(--green); margin:0 1px; font-weight:900}
.live{
  display:inline-flex; align-items:center; gap:6px;
  font:700 9px/1 'JetBrains Mono',monospace;
  letter-spacing:.16em; color:var(--muted);
}
.live .dot{width:5px; height:5px; border-radius:50%; background:var(--green); animation:pulse 2.4s infinite}
.live.off .dot{background:var(--dim); animation:none; box-shadow:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(63,224,129,.55)}
  70%{box-shadow:0 0 0 6px rgba(63,224,129,0)}
  100%{box-shadow:0 0 0 0 rgba(63,224,129,0)}
}

/* add bar */
.addbar{
  display:flex; gap:8px; align-items:center;
  padding:14px 0 4px;
}
.addbar__field{
  flex:1 1 auto; min-width:0;
  position:relative;
}
.addbar__icon{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font:700 12px/1 'JetBrains Mono',monospace; color:var(--dim); pointer-events:none;
}
.addbar input{
  width:100%; height:40px;
  padding:0 12px 0 28px;
  border-radius:12px;
  border:1px solid var(--line-2);
  background:rgba(255,255,255,.02);
  color:var(--fg);
  font:500 12px/1 'JetBrains Mono',monospace;
  letter-spacing:-.01em;
  outline:none;
  transition:border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
}
.addbar input::placeholder{color:var(--dim)}
.addbar input:focus{
  border-color:var(--green-line);
  background:rgba(63,224,129,.035);
  box-shadow:0 0 0 3px rgba(63,224,129,.06);
}
.addbar button{
  flex:0 0 auto;
  height:40px; padding:0 18px;
  border-radius:12px;
  border:1px solid var(--green-line);
  background:var(--green-soft);
  color:var(--green);
  font:700 11px/1 'Inter',sans-serif;
  letter-spacing:.06em; text-transform:uppercase;
  cursor:pointer;
  transition:background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
}
.addbar button:hover:not(:disabled){
  background:rgba(63,224,129,.16);
  box-shadow:0 10px 30px -14px rgba(63,224,129,.7);
}
.addbar button:disabled{opacity:.45; cursor:not-allowed}

/* filters */
.filters{
  display:flex; gap:6px; overflow-x:auto;
  padding:12px 0 16px;
  scrollbar-width:none; -ms-overflow-style:none;
}
.filters::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--line-2);
  background:rgba(255,255,255,.02);
  color:var(--fg-2);
  font:600 11.5px/1 'Inter',sans-serif;
  white-space:nowrap; cursor:pointer;
  transition:color .18s var(--ease), background .18s var(--ease),
             border-color .18s var(--ease), box-shadow .18s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.pill:hover{color:var(--fg); border-color:#2e2e35; background:rgba(255,255,255,.045)}
.pill[aria-selected="true"]{
  color:var(--green);
  border-color:var(--green-line);
  background:var(--green-soft);
  box-shadow:0 6px 20px -12px rgba(63,224,129,.7);
}

/* feed */
.feed{display:grid; grid-template-columns:1fr; gap:14px}
@media (min-width:640px){.feed{grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}}
@media (min-width:1024px){.feed{grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px}}

/* card */
.card{
  position:relative; aspect-ratio:1/1;
  border-radius:var(--r);
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 24px 60px -46px rgba(0,0,0,.95);
  isolation:isolate;
  transition:transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
}
@media (hover:hover){
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(63,224,129,.22);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      0 30px 70px -46px rgba(0,0,0,.95),
      0 0 40px -18px rgba(63,224,129,.28);
  }
  .card:hover .card__img{transform:scale(1.06)}
}
.card.is-new{animation:cardIn .6s var(--ease) both}
@keyframes cardIn{
  from{opacity:0; transform:translateY(14px) scale(.98)}
  to{opacity:1; transform:none}
}

.card__img{
  position:absolute; inset:0; z-index:0;
  width:100%; height:100%;
  object-fit:cover; background:#0e0e10;
  transform:scale(1.01);
  transition:transform .6s var(--ease);
}
.card__scrim{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg,
    rgba(5,5,6,.72) 0%,
    rgba(5,5,6,.16) 24%,
    rgba(5,5,6,0) 38%,
    rgba(5,5,6,.42) 60%,
    rgba(5,5,6,.9) 80%,
    rgba(5,5,6,.98) 100%);
}
.card__top{
  position:absolute; top:10px; left:10px; right:10px; z-index:2;
  display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 8px; border-radius:999px;
  font:800 9px/1 'Inter',sans-serif;
  letter-spacing:.09em; text-transform:uppercase;
  color:#fff;
  background:rgba(5,5,6,.62);
  border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  position:relative; overflow:hidden;
}
.badge::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%);
  transform:translateX(-120%);
}
.badge--featured{color:#fff; border-color:rgba(255,255,255,.34); background:rgba(5,5,6,.72)}
.badge--featured::after{animation:shine 3.6s ease-in-out infinite}
.badge--trending{color:var(--green); border-color:var(--green-line); background:rgba(5,22,13,.62)}
.badge--trending::after{animation:shine 3.6s ease-in-out infinite .4s}
.badge--rising{color:var(--green); border-color:var(--green-line); background:rgba(5,22,13,.62)}
.badge--rising::after{animation:shine 2.2s ease-in-out infinite}
.badge--new{color:var(--fg-2); border-color:rgba(255,255,255,.2)}
@keyframes shine{0%,60%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}

.chip{
  flex:0 0 auto;
  padding:5px 7px; border-radius:999px;
  font:700 8px/1 'JetBrains Mono',monospace;
  letter-spacing:.12em; color:var(--fg-2);
  background:rgba(5,5,6,.62);
  border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}

.card__body{position:absolute; left:0; right:0; bottom:0; z-index:2; padding:11px 11px 10px}
.card__title{display:flex; align-items:baseline; gap:6px; min-width:0}
.card__name{
  margin:0;
  font:800 13.5px/1.15 'Inter',sans-serif;
  letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card__ticker{flex:0 0 auto; font:500 9.5px/1 'JetBrains Mono',monospace; color:var(--fg-2)}

.card__price{display:flex; align-items:center; gap:7px; margin-top:6px}
.price{
  font:700 14px/1 'JetBrains Mono',monospace;
  letter-spacing:-.02em;
  transition:color .35s var(--ease);
}
.price.flash{animation:flashUp .7s var(--ease)}
.price.flashDown{animation:flashDown .7s var(--ease)}
@keyframes flashUp{0%{color:var(--green)}100%{color:var(--fg)}}
@keyframes flashDown{0%{color:var(--red)}100%{color:var(--fg)}}
.chg{
  font:700 9px/1 'JetBrains Mono',monospace;
  padding:3px 6px; border-radius:6px; letter-spacing:-.01em;
}
.chg.up{color:var(--green); background:var(--green-soft)}
.chg.down{color:var(--red); background:var(--red-soft)}
.chg.flat{color:var(--muted); background:rgba(255,255,255,.05)}

.card__stats{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px 10px; margin-top:9px; padding-top:9px;
  border-top:1px solid rgba(255,255,255,.07);
}
@media (min-width:1024px){.card__stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{min-width:0}
.stat__k{
  font:600 7.5px/1 'Inter',sans-serif;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
}
.stat__v{
  margin-top:4px;
  font:500 9.5px/1 'JetBrains Mono',monospace;
  color:var(--fg);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.card__meta{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:8px;
  font:400 8px/1 'JetBrains Mono',monospace;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
}
.pair{
  background:none; border:0; padding:0;
  color:var(--muted); font:inherit; letter-spacing:inherit; text-transform:inherit;
  cursor:pointer; transition:color .18s var(--ease);
}
.pair:hover{color:var(--fg)}

.card__actions{display:flex; gap:5px; margin-top:9px}
.act{
  flex:1 1 0; min-width:0;
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  height:28px; padding:0 6px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.035);
  color:var(--fg-2);
  font:600 10px/1 'Inter',sans-serif;
  text-decoration:none; white-space:nowrap; cursor:pointer;
  transition:color .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.act:hover{color:var(--fg); background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2)}
.act.on{color:var(--green); background:var(--green-soft); border-color:var(--green-line)}
.act--watch.on{color:#fff; background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.34)}

/* skeleton / state / sentinel */
.sk{
  aspect-ratio:1/1; border-radius:var(--r); border:1px solid var(--line);
  background:linear-gradient(100deg,#0a0a0c 28%,#131316 50%,#0a0a0c 72%);
  background-size:220% 100%; animation:shimmer 1.5s linear infinite;
}
@keyframes shimmer{to{background-position:-220% 0}}

.state{
  grid-column:1/-1; padding:70px 20px; text-align:center;
  color:var(--muted); font-size:12.5px; line-height:1.6;
}
.state strong{
  display:block; margin-bottom:8px; color:var(--fg);
  font:800 14px/1.3 'Inter',sans-serif; letter-spacing:-.01em;
}
.state code{
  display:inline-block; margin-top:10px; padding:5px 9px; border-radius:8px;
  border:1px solid var(--line-2); background:rgba(255,255,255,.03);
  font:500 10.5px/1.5 'JetBrains Mono',monospace; color:var(--fg-2);
}

.sentinel{display:flex; align-items:center; justify-content:center; min-height:60px; padding:20px 0 60px}
.spinner{
  width:18px; height:18px; border-radius:50%;
  border:2px solid var(--line-2); border-top-color:var(--green);
  opacity:0; transition:opacity .2s var(--ease);
  animation:spin .7s linear infinite;
}
.spinner.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.end{
  font:600 9px/1 'JetBrains Mono',monospace;
  letter-spacing:.22em; text-transform:uppercase; color:var(--dim);
}

footer{
  padding:6px 16px 52px; text-align:center;
  font:400 9px/1.8 'JetBrains Mono',monospace;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
}

.toast{
  position:fixed; left:50%; bottom:24px; z-index:200;
  transform:translate(-50%,16px);
  padding:10px 14px; border-radius:12px;
  background:#101013; border:1px solid var(--line-2);
  color:var(--fg); font:600 12px/1 'Inter',sans-serif;
  box-shadow:0 24px 60px -30px #000;
  opacity:0; pointer-events:none;
  transition:opacity .25s var(--ease), transform .25s var(--ease);
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast.err{border-color:rgba(248,113,113,.5)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
  .card:hover{transform:none}
  .card:hover .card__img{transform:scale(1.01)}
}
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="header">
  <div class="wrap header__inner">
    <a class="brand" href="./">MEME<span>//</span>TRACKER</a>
    <div class="live" id="live"><span class="dot"></span><span id="liveText">LIVE</span></div>
  </div>
</header>

<main class="wrap">
  <div class="addbar">
    <div class="addbar__field">
      <span class="addbar__icon">+</span>
      <input id="caInput" type="text" spellcheck="false" autocomplete="off"
             placeholder="Paste Solana contract address (CA)…" maxlength="60">
    </div>
    <button id="caAdd" type="button">Add</button>
  </div>

  <nav class="filters" role="tablist" aria-label="Feed filters">
    <button class="pill" role="tab" data-sort="trending"  aria-selected="true">🔥 Trending</button>
    <button class="pill" role="tab" data-sort="new"       aria-selected="false">🆕 New</button>
    <button class="pill" role="tab" data-sort="rising"    aria-selected="false">📈 Rising</button>
    <button class="pill" role="tab" data-sort="liquidity" aria-selected="false">💧 Liquidity</button>
  </nav>

  <section class="feed" id="feed"></section>
  <div class="sentinel" id="sentinel"><div class="spinner" id="spinner"></div></div>
</main>

<footer class="wrap">
  Data · DexScreener &nbsp;·&nbsp; Storage · Supabase &nbsp;·&nbsp; Not financial advice
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const CONFIG = {
  SUPABASE_URL:      'https://piexelytvvfsoeqhlokb.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_neiQC042cfc6Io2r8Cf6hw_WoecdytJ',
  PAGE_SIZE: 24
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const SUB = '₀₁₂₃₄₅₆₇₈₉';
const sub = n => String(n).split('').map(d => SUB[+d] ?? d).join('');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));

function num(v){
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function fmtPrice(v){
  const n = num(v);
  if (n === null) return '—';
  if (n === 0) return '$0';
  const a = Math.abs(n);
  if (a >= 1000)   return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (a >= 1)      return '$' + n.toFixed(2);
  if (a >= 0.01)   return '$' + n.toFixed(4);
  if (a >= 0.0001) return '$' + n.toFixed(6);
  const m = n.toFixed(20).match(/^0\.(0+)(\d{1,4})/);
  if (m) return '$0.0' + sub(m[1].length) + m[2];
  return '$' + n.toExponential(2);
}
function fmtCompact(v){
  const n = num(v);
  if (n === null) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(a < 10 ? 2 : 0);
}
function fmtInt(v){
  const n = num(v);
  if (n === null) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function fmtPct(v){
  const n = num(v);
  if (n === null) return '—';
  const d = Math.abs(n) >= 1000 ? 0 : 2;
  return (n > 0 ? '+' : '') + n.toFixed(d) + '%';
}
const shortAddr = a => (!a || a.length < 10) ? (a || '—') : a.slice(0, 4) + '…' + a.slice(-4);

const state = {
  filter: 'trending',
  offset: 0,
  loading: false,
  done: false,
  user: null,
  likes: new Set(),
  watch: new Set(),
  seen: new Set()
};

let sb = null;
const feed     = $('#feed');
const sentinel = $('#sentinel');
const spinner  = $('#spinner');
const toastEl  = $('#toast');
const caInput  = $('#caInput');
const caAdd    = $('#caAdd');

let toastTimer;
function toast(msg, isErr = false){
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isErr);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

function setLive(mode){
  const el = $('#live'), txt = $('#liveText');
  if (mode === 'on'){ el.classList.remove('off'); txt.textContent = 'LIVE'; }
  else if (mode === 'connecting'){ el.classList.remove('off'); txt.textContent = 'SYNC'; }
  else { el.classList.add('off'); txt.textContent = 'OFFLINE'; }
}

function initSupabase(){
  const { SUPABASE_URL: url, SUPABASE_ANON_KEY: key } = CONFIG;
  if (!window.supabase) return null;
  if (!url || !key || url.includes('TU-PROYECTO') || key.includes('TU_ANON_KEY')) return null;
  return window.supabase.createClient(url, key, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
}

async function ensureAuth(){
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) return session.user;
    const { data, error } = await sb.auth.signInAnonymously();
    if (error){ console.warn('[auth]', error.message); return null; }
    return data?.user ?? null;
  } catch (e){ console.warn('[auth]', e); return null; }
}

async function loadUserData(){
  state.likes.clear();
  state.watch.clear();
  if (!state.user) return;
  try {
    const [l, w] = await Promise.all([
      sb.from('likes').select('meme_id').eq('user_id', state.user.id),
      sb.from('watchlist').select('meme_id').eq('user_id', state.user.id)
    ]);
    (l.data || []).forEach(r => state.likes.add(r.meme_id));
    (w.data || []).forEach(r => state.watch.add(r.meme_id));
  } catch (e){ console.warn('[user data]', e); }
}

function badgeFor(m){
  const trend = (m.trend || '').toLowerCase();
  if (m.featured || trend === 'featured') return { key:'featured', icon:'👑', label:'Featured' };
  const ageH = m.created_at ? (Date.now() - new Date(m.created_at).getTime()) / 36e5 : null;
  const chg  = num(m.price_change_24h);
  if (trend === 'rising' || (chg !== null && chg >= 20)) return { key:'rising', icon:'🔥', label:'Rising' };
  if (trend === 'new'    || (ageH !== null && ageH <= 48)) return { key:'new', icon:'🆕', label:'New' };
  if (trend === 'trending') return { key:'trending', icon:'⚡', label:'Trending' };
  return { key:'trending', icon:'⚡', label:'Trending' };
}

function cardHTML(m){
  const badge = badgeFor(m);
  const chg = num(m.price_change_24h);
  const chgCls = chg === null ? 'flat' : chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';

  const buys  = num(m.buys_24h);
  const sells = num(m.sells_24h);
  let txns = num(m.txns_24h);
  if (txns === null && (buys !== null || sells !== null)) txns = (buys || 0) + (sells || 0);

  const pair   = m.pair_address || '';
  const dexUrl = m.url || (pair ? `https://dexscreener.com/${m.chain || 'solana'}/${pair}` : '#');
  const liked  = state.likes.has(m.id) ? ' on' : '';
  const watched = state.watch.has(m.id) ? ' on' : '';

  const img = m.image_url
    ? `<img class="card__img" src="${esc(m.image_url)}" alt="" loading="lazy" decoding="async"
            referrerpolicy="no-referrer" onerror="this.remove()">`
    : '';

  return `
    ${img}
    <div class="card__scrim"></div>
    <div class="card__top">
      <span class="badge badge--${badge.key}">${badge.icon} ${badge.label}</span>
      <span class="chip">${esc((m.chain || '—').toUpperCase())}</span>
    </div>
    <div class="card__body">
      <div class="card__title">
        <h3 class="card__name" title="${esc(m.name || '')}">${esc(m.name || 'Unknown')}</h3>
        <span class="card__ticker">$${esc(m.symbol || '—')}</span>
      </div>
      <div class="card__price">
        <span class="price" data-f="price">${fmtPrice(m.price_usd)}</span>
        <span class="chg ${chgCls}" data-f="chg">${fmtPct(chg)}</span>
      </div>
      <div class="card__stats">
        <div class="stat"><div class="stat__k">Volume 24H</div><div class="stat__v" data-f="vol">${fmtCompact(m.volume_24h)}</div></div>
        <div class="stat"><div class="stat__k">Market Cap</div><div class="stat__v" data-f="mcap">${fmtCompact(m.market_cap ?? m.fdv)}</div></div>
        <div class="stat"><div class="stat__k">Liquidity</div><div class="stat__v" data-f="liq">${fmtCompact(m.liquidity_usd)}</div></div>
        <div class="stat"><div class="stat__k">Transactions</div><div class="stat__v" data-f="txns">${fmtInt(txns)}</div></div>
      </div>
      <div class="card__meta">
        <span>${esc((m.chain || '—').toUpperCase())} · ${esc((m.dex_id || '—').toUpperCase())}</span>
        <button class="pair" data-act="copy" data-pair="${esc(pair)}" title="Copy pair address">${esc(shortAddr(pair))}</button>
      </div>
      <div class="card__actions">
        <button class="act act--like${liked}" data-act="like" aria-pressed="${liked ? 'true' : 'false'}">♡ Like</button>
        <button class="act act--watch${watched}" data-act="watch" aria-pressed="${watched ? 'true' : 'false'}">◇ Watch</button>
        <a class="act" href="${esc(dexUrl)}" target="_blank" rel="noopener noreferrer">↗ Dex</a>
      </div>
    </div>
  `;
}

function renderSkeletons(n = 9){
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'sk';
    d.dataset.skeleton = '1';
    frag.appendChild(d);
  }
  feed.appendChild(frag);
}
const clearSkeletons = () => $$('[data-skeleton]', feed).forEach(e => e.remove());

function renderState(kind, detail){
  const div = document.createElement('div');
  div.className = 'state';
  if (kind === 'setup'){
    div.innerHTML = `<strong>Falta configurar Supabase</strong>Abre <code>index.html</code> y rellena <code>CONFIG.SUPABASE_URL</code> y <code>CONFIG.SUPABASE_ANON_KEY</code>.`;
  } else if (kind === 'empty'){
    div.innerHTML = `<strong>Nada por aquí todavía</strong>No hay memes activos para este filtro.`;
  } else {
    div.innerHTML = `<strong>No se pudo cargar el feed</strong>${esc(detail || 'Error desconocido')}`;
  }
  feed.appendChild(div);
}

function appendCards(rows, { prepend = false, animate = false } = {}){
  const frag = document.createDocumentFragment();
  const list = [];
  for (const m of rows){
    if (!m?.id || state.seen.has(m.id)) continue;
    state.seen.add(m.id);
    const el = document.createElement('article');
    el.className = 'card' + (animate ? ' is-new' : '');
    el.dataset.id = m.id;
    el.innerHTML = cardHTML(m);
    frag.appendChild(el);
    list.push(el);
  }
  if (prepend) feed.prepend(frag);
  else feed.appendChild(frag);
  return list.length;
}

function refreshActionStates(){
  $$('.card', feed).forEach(card => {
    const id = card.dataset.id;
    const like  = $('[data-act="like"]', card);
    const watch = $('[data-act="watch"]', card);
    if (like){
      const on = state.likes.has(id);
      like.classList.toggle('on', on);
      like.setAttribute('aria-pressed', String(on));
    }
    if (watch){
      const on = state.watch.has(id);
      watch.classList.toggle('on', on);
      watch.setAttribute('aria-pressed', String(on));
    }
  });
}

async function fetchPage(){
  const { data, error } = await sb.rpc('get_meme_feed', {
    p_sort:   state.filter,
    p_limit:  CONFIG.PAGE_SIZE,
    p_offset: state.offset
  });
  if (error) throw new Error(error.message);
  return Array.isArray(data) ? data : [];
}

async function loadMore(isFirst = false){
  if (!sb || state.loading || state.done) return;
  state.loading = true;
  if (!isFirst) spinner.classList.add('on');
  try {
    const rows = await fetchPage();
    if (isFirst) clearSkeletons();
    if (!rows.length){
      state.done = true;
      if (state.offset === 0) renderState('empty');
      else showEnd();
    } else {
      appendCards(rows);
      state.offset += rows.length;
      if (rows.length < CONFIG.PAGE_SIZE){ state.done = true; showEnd(); }
    }
  } catch (e){
    console.error('[feed]', e);
    if (isFirst){ clearSkeletons(); renderState('error', e.message); }
    else toast('Error cargando más memes', true);
  } finally {
    state.loading = false;
    spinner.classList.remove('on');
  }
}

function showEnd(){
  if ($('.end', sentinel)) return;
  const d = document.createElement('div');
  d.className = 'end';
  d.textContent = '— End of feed —';
  sentinel.appendChild(d);
}

async function resetFeed(sort){
  if (!sb) return;
  state.filter = sort;
  state.offset = 0;
  state.done = false;
  state.loading = false;
  state.seen.clear();
  feed.innerHTML = '';
  $('.end', sentinel)?.remove();
  renderSkeletons(9);
  await loadMore(true);
}

const io = new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) loadMore(false);
}, { rootMargin: '900px 0px' });
io.observe(sentinel);

async function toggleLike(btn, memeId){
  if (!state.user){ toast('Auth no disponible', true); return; }
  const wasOn = state.likes.has(memeId);
  const next = !wasOn;
  btn.classList.toggle('on', next);
  btn.setAttribute('aria-pressed', String(next));
  next ? state.likes.add(memeId) : state.likes.delete(memeId);
  const res = next
    ? await sb.from('likes').insert({ user_id: state.user.id, meme_id: memeId })
    : await sb.from('likes').delete().eq('user_id', state.user.id).eq('meme_id', memeId);
  if (res.error){
    btn.classList.toggle('on', wasOn);
    btn.setAttribute('aria-pressed', String(wasOn));
    wasOn ? state.likes.add(memeId) : state.likes.delete(memeId);
    toast('No se pudo guardar el like', true);
  }
}

async function toggleWatch(btn, memeId){
  if (!state.user){ toast('Auth no disponible', true); return; }
  const wasOn = state.watch.has(memeId);
  const next = !wasOn;
  btn.classList.toggle('on', next);
  btn.setAttribute('aria-pressed', String(next));
  next ? state.watch.add(memeId) : state.watch.delete(memeId);
  const res = next
    ? await sb.from('watchlist').insert({ user_id: state.user.id, meme_id: memeId })
    : await sb.from('watchlist').delete().eq('user_id', state.user.id).eq('meme_id', memeId);
  if (res.error){
    btn.classList.toggle('on', wasOn);
    btn.setAttribute('aria-pressed', String(wasOn));
    wasOn ? state.watch.add(memeId) : state.watch.delete(memeId);
    toast('No se pudo guardar en watchlist', true);
  }
}

async function copyPair(btn){
  const p = btn.dataset.pair;
  if (!p){ toast('Sin pair address', true); return; }
  try { await navigator.clipboard.writeText(p); toast('Pair address copiado'); }
  catch { toast('No se pudo copiar', true); }
}

feed.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  if (btn.dataset.act === 'like')  toggleLike(btn, id);
  if (btn.dataset.act === 'watch') toggleWatch(btn, id);
  if (btn.dataset.act === 'copy')  copyPair(btn);
});

/* ============================================================
   CA add
   ============================================================ */
const SOL_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;

async function addByCA(){
  const raw = caInput.value.trim();
  if (!raw){ toast('Pega un contract address primero', true); return; }
  if (!SOL_RE.test(raw)){ toast('No parece una dirección Solana válida', true); return; }

  caAdd.disabled = true;
  const original = caAdd.textContent;
  caAdd.textContent = 'Adding…';

  try {
    const { data, error } = await sb.functions.invoke('hyper-api', {
      body: { address: raw }
    });
    if (error) throw new Error(error.message || 'Function error');
    if (!data?.ok) throw new Error(data?.error || 'Unknown error');

    const m = data.meme;
    state.seen.delete(m.id); // in case it was already loaded
    const added = appendCards([m], { prepend: true, animate: true });
    caInput.value = '';
    if (added) toast(`Added $${m.symbol || '?'}`);
    else toast('Ya estaba en el feed');
  } catch (e){
    console.warn('[add]', e);
    toast(e.message || 'No se pudo añadir', true);
  } finally {
    caAdd.disabled = false;
    caAdd.textContent = original;
  }
}

caAdd.addEventListener('click', addByCA);
caInput.addEventListener('keydown', e => { if (e.key === 'Enter') addByCA(); });

/* ============================================================
   Realtime patch
   ============================================================ */
function patchCard(m){
  const el = feed.querySelector(`.card[data-id="${m.id}"]`);
  if (!el) return;

  const priceEl = el.querySelector('[data-f="price"]');
  if (priceEl){
    const before = priceEl.textContent;
    const after = fmtPrice(m.price_usd);
    if (before !== after && before !== '—'){
      priceEl.textContent = after;
      priceEl.classList.remove('flash','flashDown');
      void priceEl.offsetWidth;
      const chg = num(m.price_change_24h);
      priceEl.classList.add(chg !== null && chg < 0 ? 'flashDown' : 'flash');
    } else {
      priceEl.textContent = after;
    }
  }

  const set = (f, v) => { const n = el.querySelector(`[data-f="${f}"]`); if (n) n.textContent = v; };
  set('vol',  fmtCompact(m.volume_24h));
  set('mcap', fmtCompact(m.market_cap ?? m.fdv));
  set('liq',  fmtCompact(m.liquidity_usd));
  set('txns', fmtInt(m.txns_24h));

  const chgEl = el.querySelector('[data-f="chg"]');
  if (chgEl){
    const chg = num(m.price_change_24h);
    chgEl.textContent = fmtPct(chg);
    chgEl.className = 'chg ' + (chg === null ? 'flat' : chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat');
  }
}

function subscribeRealtime(){
  try {
    sb.channel('memes-feed')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'memes' },
          payload => { if (payload?.new) patchCard(payload.new); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'memes' },
          payload => {
            const m = payload?.new;
            if (!m?.active || state.seen.has(m.id)) return;
            state.seen.add(m.id);
            const el = document.createElement('article');
            el.className = 'card is-new';
            el.dataset.id = m.id;
            el.innerHTML = cardHTML(m);
            feed.prepend(el);
          })
      .subscribe(status => { if (status === 'SUBSCRIBED') setLive('on'); });
  } catch (e){ console.warn('[realtime]', e); }
}

/* filters */
$$('.pill').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.getAttribute('aria-selected') === 'true') return;
    $$('.pill').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
    resetFeed(btn.dataset.sort);
  });
});

/* boot */
(async function boot(){
  sb = initSupabase();
  if (!sb){ setLive('off'); renderState('setup'); return; }
  setLive('connecting');
  clearSkeletons();
  state.user = await ensureAuth();
  await loadUserData();
  await resetFeed('trending');
  setLive('on');
  subscribeRealtime();
  sb.auth.onAuthStateChange(async (_event, session) => {
    state.user = session?.user ?? null;
    await loadUserData();
    refreshActionStates();
  });
})();
</script>
