<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050506">
<title>MEME//TRACKER</title>
<meta name="description" content="Curated meme tracker — real on-chain data from DexScreener.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040405;
  --card:#0a0a0c;
  --line:#131316;
  --line-2:#202027;
  --fg:#f5f5f7;
  --fg-2:#a1a1aa;
  --muted:#71717a;
  --dim:#3f3f46;
  --green:#3fe081;
  --green-soft:rgba(63,224,129,.1);
  --green-line:rgba(63,224,129,.4);
  --red:#f87171;
  --red-soft:rgba(248,113,113,.1);
  --r:22px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh;
  background:var(--bg); color:var(--fg);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
button,input{font-family:inherit}
img{display:block}

/* BACKGROUND */
.bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 15% -20%, rgba(63,224,129,.07), transparent 60%),
    radial-gradient(900px 700px at 110% 10%, rgba(120,120,255,.035), transparent 60%),
    radial-gradient(1000px 800px at 50% 120%, rgba(63,224,129,.035), transparent 65%);
}
.grain{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:.035; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.scan{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background:repeating-linear-gradient(0deg,
    rgba(255,255,255,.012) 0px,
    rgba(255,255,255,.012) 1px,
    transparent 1px,
    transparent 3px);
  mix-blend-mode:overlay;
}
.wrap{
  width:100%; max-width:1400px;
  margin:0 auto; padding:0 18px;
  position:relative; z-index:1;
}

/* HEADER */
.header{
  position:sticky; top:0; z-index:60;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(4,4,5,.95), rgba(4,4,5,.78));
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  backdrop-filter:blur(22px) saturate(150%);
}
.header__inner{
  min-height:62px;
  display:flex; align-items:center; gap:18px;
  padding:12px 0;
}
@media (max-width:760px){ .header__inner{flex-wrap:wrap; gap:10px} }

.brand{
  font:900 14.5px/1 'Inter',sans-serif;
  letter-spacing:-.02em; color:var(--fg);
  text-decoration:none;
  display:inline-flex; align-items:center;
  flex:0 0 auto;
}
.brand span{color:var(--green); margin:0 1px; font-weight:900; text-shadow:0 0 18px rgba(63,224,129,.6)}

.cmd{
  flex:1 1 300px; min-width:0;
  display:flex; align-items:center; gap:8px;
  height:40px; padding:0 6px 0 14px;
  border-radius:13px;
  border:1px solid var(--line-2);
  background:rgba(255,255,255,.02);
  transition:border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
}
.cmd:focus-within{
  border-color:var(--green-line);
  background:rgba(63,224,129,.035);
  box-shadow:0 0 0 4px rgba(63,224,129,.06), 0 0 30px -10px rgba(63,224,129,.3);
}
.cmd__prompt{
  flex:0 0 auto;
  font:700 12px/1 'JetBrains Mono',monospace;
  color:var(--green); opacity:.85; user-select:none;
}
.cmd input{
  flex:1 1 auto; min-width:0; height:100%;
  border:0; outline:0; background:transparent;
  color:var(--fg);
  font:500 12.5px/1 'JetBrains Mono',monospace;
  letter-spacing:-.005em;
}
.cmd input::placeholder{color:var(--dim)}
.cmd button{
  flex:0 0 auto;
  height:30px; padding:0 14px;
  border-radius:9px;
  border:1px solid var(--green-line);
  background:var(--green-soft);
  color:var(--green);
  font:700 10.5px/1 'Inter',sans-serif;
  letter-spacing:.1em; text-transform:uppercase;
  cursor:pointer;
  transition:background .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
}
.cmd button:hover:not(:disabled){
  background:rgba(63,224,129,.18);
  box-shadow:0 8px 24px -12px rgba(63,224,129,.7);
}
.cmd button:disabled{opacity:.4; cursor:not-allowed}

.live{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid var(--line-2);
  background:rgba(255,255,255,.02);
  font:700 9.5px/1 'JetBrains Mono',monospace;
  letter-spacing:.18em; color:var(--muted);
}
.live .dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(63,224,129,.9);
  animation:pulse 2.4s infinite;
}
.live.off{color:var(--dim)}
.live.off .dot{background:var(--dim); animation:none; box-shadow:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(63,224,129,.55), 0 0 10px rgba(63,224,129,.9)}
  70%{box-shadow:0 0 0 8px rgba(63,224,129,0), 0 0 10px rgba(63,224,129,.9)}
  100%{box-shadow:0 0 0 0 rgba(63,224,129,0), 0 0 10px rgba(63,224,129,.9)}
}

/* FEED — 4 columns on desktop */
main{padding-top:20px}
.feed{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media (min-width:560px){ .feed{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:900px){ .feed{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1100px){ .feed{grid-template-columns:repeat(4,minmax(0,1fr))} }

/* CARD */
.card{
  position:relative;
  aspect-ratio:1/1;
  border-radius:var(--r);
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 30px 70px -50px rgba(0,0,0,.95);
  isolation:isolate;
  transition:transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
}
@media (hover:hover){
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(63,224,129,.3);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      0 40px 90px -50px rgba(0,0,0,.95),
      0 0 70px -18px rgba(63,224,129,.35);
  }
  .card:hover .card__img{transform:scale(1.07)}
  .card:hover .card__dex{
    border-color:rgba(63,224,129,.45);
    background:rgba(63,224,129,.16);
    color:var(--green);
    box-shadow:0 0 20px -4px rgba(63,224,129,.5);
  }
  .card:hover .card__scrim::after{opacity:1}
}
.card.is-new{animation:cardIn .7s var(--ease) both}
@keyframes cardIn{
  from{opacity:0; transform:translateY(16px) scale(.97)}
  to{opacity:1; transform:none}
}
.card__img{
  position:absolute; inset:0; z-index:0;
  width:100%; height:100%; object-fit:cover;
  background:#0c0c0e;
  transform:scale(1.02);
  transition:transform .8s var(--ease);
}
.card__scrim{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg,
    rgba(4,4,5,.72) 0%, rgba(4,4,5,.14) 22%, rgba(4,4,5,0) 38%,
    rgba(4,4,5,.38) 58%, rgba(4,4,5,.86) 78%, rgba(4,4,5,.98) 100%);
}
.card__scrim::after{
  content:''; position:absolute; inset:0;
  background:radial-gradient(120% 60% at 50% 100%, rgba(63,224,129,.12), transparent 55%);
  opacity:0; transition:opacity .4s var(--ease);
}

.card__top{
  position:absolute; top:11px; left:11px; right:11px; z-index:2;
  display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 10px; border-radius:999px;
  font:800 9.5px/1 'Inter',sans-serif;
  letter-spacing:.14em; text-transform:uppercase;
  color:#fff;
  background:rgba(4,4,5,.62);
  border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  position:relative; overflow:hidden; flex:0 0 auto;
}
.badge::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.22) 50%, transparent 60%);
  transform:translateX(-130%);
}
.badge--featured{
  color:#0a0a0c;
  background:linear-gradient(135deg, #ffffff, #e8e8ee);
  border-color:rgba(255,255,255,.6);
  box-shadow:0 0 24px -8px rgba(255,255,255,.5);
}
.badge--featured::after{animation:shine 4s ease-in-out infinite}
.badge--trending{
  color:var(--green);
  border-color:var(--green-line);
  background:rgba(6,26,15,.75);
  box-shadow:0 0 22px -8px rgba(63,224,129,.55);
}
.badge--trending::after{animation:shine 3.4s ease-in-out infinite .6s}
.badge--rising{
  color:#fff;
  border-color:rgba(255,255,255,.4);
  background:rgba(4,4,5,.75);
  box-shadow:0 0 22px -8px rgba(255,255,255,.35);
}
.badge--rising::after{animation:shine 2.6s ease-in-out infinite}
.badge--new{
  color:var(--fg);
  border-color:rgba(255,255,255,.24);
  background:rgba(4,4,5,.62);
}
@keyframes shine{0%,55%{transform:translateX(-130%)}80%,100%{transform:translateX(130%)}}

.card__dex{
  flex:0 0 auto;
  width:32px; height:32px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(4,4,5,.6);
  color:var(--fg);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  text-decoration:none;
  transition:background .2s var(--ease), border-color .2s var(--ease),
             color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.card__dex:active{transform:scale(.92)}
.card__dex svg{display:block; width:13px; height:13px}

.card__body{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  padding:11px 12px 12px;
}
.card__title{
  display:flex; align-items:baseline; gap:6px; min-width:0;
  margin:0 0 6px;
}
.card__name{
  margin:0;
  font:800 15px/1.1 'Inter',sans-serif;
  letter-spacing:-.025em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  min-width:0;
}
.card__ticker{
  flex:0 0 auto;
  font:500 10px/1 'JetBrains Mono',monospace;
  color:var(--fg-2); letter-spacing:-.005em;
}
.card__price{
  display:flex; align-items:center; gap:8px;
  margin-bottom:9px;
}
.price{
  font:700 17px/1 'JetBrains Mono',monospace;
  letter-spacing:-.03em;
  transition:color .3s var(--ease);
  white-space:nowrap;
}
.price.up  {color:var(--green)}
.price.down{color:var(--red)}
.price.flat{color:var(--fg)}
.price.flash{animation:flashUp .8s var(--ease)}
.price.flashDown{animation:flashDown .8s var(--ease)}
@keyframes flashUp{0%{text-shadow:0 0 22px rgba(63,224,129,.9)}100%{text-shadow:none}}
@keyframes flashDown{0%{text-shadow:0 0 22px rgba(248,113,113,.9)}100%{text-shadow:none}}

.chg{
  font:700 9.5px/1 'JetBrains Mono',monospace;
  padding:4px 6px; border-radius:6px;
  letter-spacing:-.01em; white-space:nowrap;
}
.chg.up{color:var(--green); background:var(--green-soft); border:1px solid rgba(63,224,129,.2)}
.chg.down{color:var(--red); background:var(--red-soft); border:1px solid rgba(248,113,113,.2)}
.chg.flat{color:var(--muted); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.06)}

.card__stats{
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.07);
}
.stat{min-width:0}
.stat__k{
  font:600 7.5px/1 'Inter',sans-serif;
  letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted);
}
.stat__v{
  margin-top:4px;
  font:500 10px/1 'JetBrains Mono',monospace;
  color:var(--fg); letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* SKELETON */
.sk{
  aspect-ratio:1/1;
  border-radius:var(--r);
  border:1px solid var(--line);
  background:linear-gradient(100deg,#090909 30%,#111113 50%,#090909 70%);
  background-size:220% 100%;
  animation:shimmer 1.6s linear infinite;
}
@keyframes shimmer{to{background-position:-220% 0}}

/* STATES */
.state{
  grid-column:1/-1;
  padding:90px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px; line-height:1.6;
}
.state strong{
  display:block; margin-bottom:10px;
  color:var(--fg);
  font:800 16px/1.3 'Inter',sans-serif;
  letter-spacing:-.02em;
}
.state code{
  display:inline-block; margin-top:14px;
  padding:6px 10px; border-radius:8px;
  border:1px solid var(--line-2);
  background:rgba(255,255,255,.03);
  font:500 11px/1.5 'JetBrains Mono',monospace;
  color:var(--fg-2);
}

/* SENTINEL */
.sentinel{
  display:flex; align-items:center; justify-content:center;
  min-height:80px;
  padding:28px 0 80px;
}
.spinner{
  width:20px; height:20px; border-radius:50%;
  border:2px solid var(--line-2);
  border-top-color:var(--green);
  opacity:0;
  transition:opacity .2s var(--ease);
  animation:spin .7s linear infinite;
  box-shadow:0 0 20px -8px rgba(63,224,129,.6);
}
.spinner.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.end{
  font:600 9.5px/1 'JetBrains Mono',monospace;
  letter-spacing:.28em; text-transform:uppercase;
  color:var(--dim);
}

/* FOOTER */
footer{
  padding:8px 20px 60px;
  text-align:center;
  font:400 9.5px/1.8 'JetBrains Mono',monospace;
  letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim);
}

/* TOAST */
.toast{
  position:fixed; left:50%; bottom:28px; z-index:200;
  transform:translate(-50%,20px);
  padding:12px 18px;
  border-radius:14px;
  background:#101013;
  border:1px solid var(--line-2);
  color:var(--fg);
  font:600 12.5px/1 'Inter',sans-serif;
  box-shadow:0 30px 70px -30px #000;
  opacity:0; pointer-events:none;
  transition:opacity .25s var(--ease), transform .25s var(--ease);
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast.err{border-color:rgba(248,113,113,.5)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
  .card:hover{transform:none}
  .card:hover .card__img{transform:scale(1.02)}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<header class="header">
  <div class="wrap header__inner">
    <a class="brand" href="./">MEME<span>//</span>TRACKER</a>

    <div class="cmd">
      <span class="cmd__prompt">$</span>
      <input id="caInput" type="text" spellcheck="false" autocomplete="off"
             placeholder="paste solana contract address…" maxlength="60">
      <button id="caAdd" type="button">Add</button>
    </div>

    <div class="live" id="live"><span class="dot"></span><span id="liveText">LIVE</span></div>
  </div>
</header>

<main class="wrap">
  <section class="feed" id="feed"></section>
  <div class="sentinel" id="sentinel"><div class="spinner" id="spinner"></div></div>
</main>

<footer class="wrap">
  Data · DexScreener &nbsp;·&nbsp; Storage · Supabase &nbsp;·&nbsp; Not financial advice
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const CONFIG = {
  SUPABASE_URL:      'https://piexelytvvfsoeqhlokb.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_neiQC042cfc6Io2r8Cf6hw_WoecdytJ',
  PAGE_SIZE: 24,
  SORT: 'trending',
  POLL_MS: 15000
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const SUB = '₀₁₂₃₄₅₆₇₈₉';
const sub = n => String(n).split('').map(d => SUB[+d] ?? d).join('');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));

function num(v){
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function fmtPrice(v){
  const n = num(v);
  if (n === null) return '—';
  if (n === 0) return '$0';
  const a = Math.abs(n);
  if (a >= 1000)   return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (a >= 1)      return '$' + n.toFixed(2);
  if (a >= 0.01)   return '$' + n.toFixed(4);
  if (a >= 0.0001) return '$' + n.toFixed(6);
  const m = n.toFixed(20).match(/^0\.(0+)(\d{1,4})/);
  if (m) return '$0.0' + sub(m[1].length) + m[2];
  return '$' + n.toExponential(2);
}
function fmtCompact(v){
  const n = num(v);
  if (n === null) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(a < 10 ? 2 : 0);
}
function fmtInt(v){
  const n = num(v);
  if (n === null) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function fmtPct(v){
  const n = num(v);
  if (n === null) return '—';
  const d = Math.abs(n) >= 1000 ? 0 : 2;
  return (n > 0 ? '+' : '') + n.toFixed(d) + '%';
}

const state = { offset: 0, loading: false, done: false, seen: new Set() };

let sb = null;
const feed     = $('#feed');
const sentinel = $('#sentinel');
const spinner  = $('#spinner');
const toastEl  = $('#toast');
const caInput  = $('#caInput');
const caAdd    = $('#caAdd');

let toastTimer;
function toast(msg, isErr = false){
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isErr);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

function setLive(mode){
  const el = $('#live'), txt = $('#liveText');
  if (mode === 'on'){ el.classList.remove('off'); txt.textContent = 'LIVE'; }
  else if (mode === 'connecting'){ el.classList.remove('off'); txt.textContent = 'SYNC'; }
  else { el.classList.add('off'); txt.textContent = 'OFFLINE'; }
}

function initSupabase(){
  const { SUPABASE_URL: url, SUPABASE_ANON_KEY: key } = CONFIG;
  if (!window.supabase) return null;
  if (!url || !key || url.includes('TU-PROYECTO') || key.includes('TU_ANON_KEY')) return null;
  return window.supabase.createClient(url, key);
}

/* BADGE — solo curación manual + pump real */
function badgeFor(m){
  if (m.featured) return { key:'featured', icon:'👑', label:'Featured' };

  const trend = (m.trend || '').toLowerCase();
  if (trend === 'rising') return { key:'rising', icon:'🔥', label:'Rising' };
  if (trend === 'new')    return { key:'new',    icon:'🆕', label:'New' };

  const chg = num(m.price_change_24h);
  if (chg !== null && chg >= 100) return { key:'rising', icon:'🔥', label:'Rising' };

  return { key:'trending', icon:'⚡', label:'Trending' };
}

function cardHTML(m){
  const badge = badgeFor(m);
  const chg = num(m.price_change_24h);
  const chgCls = chg === null ? 'flat' : chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';

  const buys  = num(m.buys_24h);
  const sells = num(m.sells_24h);
  let txns = num(m.txns_24h);
  if (txns === null && (buys !== null || sells !== null)) txns = (buys || 0) + (sells || 0);

  const pair   = m.pair_address || '';
  const dexUrl = m.url || (pair ? `https://dexscreener.com/${m.chain || 'solana'}/${pair}` : '#');

  const img = m.image_url
    ? `<img class="card__img" src="${esc(m.image_url)}" alt="" loading="lazy" decoding="async"
            referrerpolicy="no-referrer" onerror="this.remove()">`
    : '';

  return `
    ${img}
    <div class="card__scrim"></div>

    <div class="card__top">
      <span class="badge badge--${badge.key}">${badge.icon} ${badge.label}</span>
      <a class="card__dex" href="${esc(dexUrl)}" target="_blank" rel="noopener noreferrer"
         aria-label="Open on DexScreener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17 17 7"/>
          <path d="M8 7h9v9"/>
        </svg>
      </a>
    </div>

    <div class="card__body">
      <div class="card__title">
        <h3 class="card__name" title="${esc(m.name || '')}">${esc(m.name || 'Unknown')}</h3>
        <span class="card__ticker">$${esc(m.symbol || '—')}</span>
      </div>

      <div class="card__price">
        <span class="price ${chgCls}" data-f="price">${fmtPrice(m.price_usd)}</span>
        <span class="chg ${chgCls}" data-f="chg">${fmtPct(chg)}</span>
      </div>

      <div class="card__stats">
        <div class="stat">
          <div class="stat__k">Vol</div>
          <div class="stat__v" data-f="vol">${fmtCompact(m.volume_24h)}</div>
        </div>
        <div class="stat">
          <div class="stat__k">MCap</div>
          <div class="stat__v" data-f="mcap">${fmtCompact(m.market_cap ?? m.fdv)}</div>
        </div>
        <div class="stat">
          <div class="stat__k">Liq</div>
          <div class="stat__v" data-f="liq">${fmtCompact(m.liquidity_usd)}</div>
        </div>
        <div class="stat">
          <div class="stat__k">Txns</div>
          <div class="stat__v" data-f="txns">${fmtInt(txns)}</div>
        </div>
      </div>
    </div>
  `;
}

function renderSkeletons(n = 8){
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'sk';
    d.dataset.skeleton = '1';
    frag.appendChild(d);
  }
  feed.appendChild(frag);
}
const clearSkeletons = () => $$('[data-skeleton]', feed).forEach(e => e.remove());

function renderState(kind, detail){
  const div = document.createElement('div');
  div.className = 'state';
  if (kind === 'setup'){
    div.innerHTML = `<strong>Falta configurar Supabase</strong>Abre <code>index.html</code> y rellena <code>CONFIG.SUPABASE_URL</code> y <code>CONFIG.SUPABASE_ANON_KEY</code>.`;
  } else if (kind === 'empty'){
    div.innerHTML = `<strong>Nada por aquí todavía</strong>No hay memes activos. Pega una CA arriba o espera al próximo sync.`;
  } else {
    div.innerHTML = `<strong>No se pudo cargar el feed</strong>${esc(detail || 'Error desconocido')}`;
  }
  feed.appendChild(div);
}

function appendCards(rows, { prepend = false, animate = false } = {}){
  const frag = document.createDocumentFragment();
  let count = 0;
  for (const m of rows){
    if (!m?.id || state.seen.has(m.id)) continue;
    state.seen.add(m.id);
    const el = document.createElement('article');
    el.className = 'card' + (animate ? ' is-new' : '');
    el.dataset.id = m.id;
    el.dataset.pair = m.pair_address || '';
    el.innerHTML = cardHTML(m);
    frag.appendChild(el);
    count++;
  }
  if (prepend) feed.prepend(frag);
  else feed.appendChild(frag);
  return count;
}

async function fetchPage(){
  const { data, error } = await sb.rpc('get_meme_feed', {
    p_sort:   CONFIG.SORT,
    p_limit:  CONFIG.PAGE_SIZE,
    p_offset: state.offset
  });
  if (error) throw new Error(error.message);
  return Array.isArray(data) ? data : [];
}

async function loadMore(isFirst = false){
  if (!sb || state.loading || state.done) return;
  state.loading = true;
  if (!isFirst) spinner.classList.add('on');
  try {
    const rows = await fetchPage();
    if (isFirst) clearSkeletons();
    if (!rows.length){
      state.done = true;
      if (state.offset === 0) renderState('empty');
      else showEnd();
    } else {
      appendCards(rows);
      state.offset += rows.length;
      if (rows.length < CONFIG.PAGE_SIZE){ state.done = true; showEnd(); }
    }
  } catch (e){
    console.error('[feed]', e);
    if (isFirst){ clearSkeletons(); renderState('error', e.message); }
    else toast('Error cargando más memes', true);
  } finally {
    state.loading = false;
    spinner.classList.remove('on');
  }
}

function showEnd(){
  if ($('.end', sentinel)) return;
  const d = document.createElement('div');
  d.className = 'end';
  d.textContent = '— End of feed —';
  sentinel.appendChild(d);
}

const io = new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) loadMore(false);
}, { rootMargin: '900px 0px' });
io.observe(sentinel);

const SOL_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;

async function addByCA(){
  const raw = caInput.value.trim();
  if (!raw){ toast('Pega un contract address primero', true); return; }
  if (!SOL_RE.test(raw)){ toast('No parece una dirección Solana válida', true); return; }

  caAdd.disabled = true;
  const original = caAdd.textContent;
  caAdd.textContent = '···';

  try {
    const { data, error } = await sb.functions.invoke('hyper-api', {
      body: { address: raw }
    });
    if (error) throw new Error(error.message || 'Function error');
    if (!data?.ok) throw new Error(data?.error || 'Unknown error');

    const m = data.meme;
    state.seen.delete(m.id);
    const added = appendCards([m], { prepend: true, animate: true });
    caInput.value = '';
    toast(added ? `Added $${m.symbol || '?'}` : 'Ya estaba en el feed');
  } catch (e){
    console.warn('[add]', e);
    toast(e.message || 'No se pudo añadir', true);
  } finally {
    caAdd.disabled = false;
    caAdd.textContent = original;
  }
}

caAdd.addEventListener('click', addByCA);
caInput.addEventListener('keydown', e => { if (e.key === 'Enter') addByCA(); });

/* LIVE POLL */
const POLL_BATCH = 30;
let pollTimer = null;
let pollRunning = false;

async function refreshVisible(){
  if (pollRunning || document.hidden) return;
  pollRunning = true;
  try {
    const pairSet = new Set();
    $$('.card[data-pair]', feed).forEach(el => {
      const p = el.dataset.pair;
      if (p) pairSet.add(p);
    });
    const pairs = [...pairSet];
    if (!pairs.length) return;

    for (let i = 0; i < pairs.length; i += POLL_BATCH){
      const chunk = pairs.slice(i, i + POLL_BATCH);
      const { data, error } = await sb.functions.invoke('refresh-feed', {
        body: { pairs: chunk }
      });
      if (error){ console.warn('[poll]', error.message); continue; }
      if (!data?.ok) continue;
      (data.memes || []).forEach(m => patchCard(m));
    }
  } catch (e){
    console.warn('[poll]', e);
  } finally {
    pollRunning = false;
  }
}

function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshVisible, CONFIG.POLL_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshVisible();
  });
}

/* REALTIME */
function patchCard(m){
  const el = feed.querySelector(`.card[data-id="${m.id}"]`);
  if (!el) return;

  const chg = num(m.price_change_24h);
  const cls = chg === null ? 'flat' : chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';

  const priceEl = el.querySelector('[data-f="price"]');
  if (priceEl){
    const before = priceEl.textContent;
    const after = fmtPrice(m.price_usd);
    priceEl.classList.remove('up','down','flat');
    priceEl.classList.add(cls);

    if (before !== after && before !== '—'){
      priceEl.textContent = after;
      priceEl.classList.remove('flash','flashDown');
      void priceEl.offsetWidth;
      priceEl.classList.add(chg !== null && chg < 0 ? 'flashDown' : 'flash');
    } else {
      priceEl.textContent = after;
    }
  }

  const set = (f, v) => { const n = el.querySelector(`[data-f="${f}"]`); if (n) n.textContent = v; };
  set('vol',  fmtCompact(m.volume_24h));
  set('mcap', fmtCompact(m.market_cap ?? m.fdv));
  set('liq',  fmtCompact(m.liquidity_usd));
  set('txns', fmtInt(m.txns_24h));

  const chgEl = el.querySelector('[data-f="chg"]');
  if (chgEl){
    chgEl.textContent = fmtPct(chg);
    chgEl.className = 'chg ' + cls;
  }
}

function subscribeRealtime(){
  try {
    sb.channel('memes-feed')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'memes' },
          payload => { if (payload?.new) patchCard(payload.new); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'memes' },
          payload => {
            const m = payload?.new;
            if (!m?.active || state.seen.has(m.id)) return;
            state.seen.add(m.id);
            const el = document.createElement('article');
            el.className = 'card is-new';
            el.dataset.id = m.id;
            el.dataset.pair = m.pair_address || '';
            el.innerHTML = cardHTML(m);
            feed.prepend(el);
          })
      .subscribe(status => { if (status === 'SUBSCRIBED') setLive('on'); });
  } catch (e){ console.warn('[realtime]', e); }
}

(async function boot(){
  sb = initSupabase();
  if (!sb){ setLive('off'); renderState('setup'); return; }
  setLive('connecting');
  renderSkeletons(8);
  await loadMore(true);
  setLive('on');
  subscribeRealtime();
  startPolling();
})();
</script>
